<style>
  :root { --bg:#0E0D12; --bgTop:#17131F; --ink:#fff; --sub:rgba(255,255,255,.72); --mine:#1FA398; --mineL:#7FE3CB; --peer:#6C4DF5; --peerL:#B9A8FF; --peer2:#E8604C; --peer2L:#FFB3A6; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; padding:0; background:var(--bg); color:var(--ink); }
  body { font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif; min-height:100vh; }

  /* ===== デモ(通話画面の描き直し) ===== */
  .mesh { position:absolute; inset:0; background:var(--bg); }
  .glow { position:absolute; width:520px; height:520px; left:-160px; top:-170px; border-radius:50%; filter:blur(60px); opacity:.55; transition:background .6s; }
  .glow2 { position:absolute; width:420px; height:420px; right:-200px; bottom:-120px; border-radius:50%; filter:blur(70px); opacity:.25; transition:background .6s; }
  .wordmark { position:absolute; left:18px; top:18px; height:30px; padding:0 10px 0 6px; display:flex; align-items:center; gap:6px; border-radius:15px; background:rgba(255,255,255,.14); border:1px solid rgba(255,255,255,.3); font-size:13px; }
  .wordmark img { width:18px; height:18px; border-radius:5px; }
  .wordmark b { font-family:Georgia,"Hiragino Mincho ProN",serif; font-weight:400; }
  .wordmark span { font-size:10px; letter-spacing:.08em; opacity:.7; }
  .blob { position:absolute; left:24px; top:58px; width:190px; height:190px; }
  .speaker { position:absolute; width:104px; height:104px; border-radius:50%; object-fit:cover; border:2px solid rgba(255,255,255,.45); box-shadow:0 6px 12px rgba(0,0,0,.4); left:67px; top:101px; transition:transform .5s cubic-bezier(.34,1.56,.64,1); }
  .spkLabel { position:absolute; left:24px; width:190px; top:254px; text-align:center; font-size:12px; letter-spacing:.06em; font-weight:600; display:flex; justify-content:center; gap:6px; align-items:center; }
  .bars { display:inline-flex; gap:2px; height:12px; align-items:center; }
  .bars i { width:3px; border-radius:2px; height:4px; }
  .listener { position:absolute; left:274px; top:160px; width:76px; text-align:center; }
  .listener img { width:76px; height:76px; border-radius:50%; object-fit:cover; border:2px solid rgba(255,255,255,.45); box-shadow:0 6px 12px rgba(0,0,0,.4); transition:transform .5s cubic-bezier(.34,1.56,.64,1); }
  .listener div { font-size:11px; letter-spacing:.06em; margin-top:6px; }
  .cards { text-align:left; position:absolute; left:20px; right:20px; top:300px; height:370px; display:flex; flex-direction:column; justify-content:flex-start; gap:10px; }
  .card { padding:13px 16px 14px; border-radius:24px; background:linear-gradient(rgba(255,255,255,.20),rgba(255,255,255,.10)); border:1px solid rgba(255,255,255,.36); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); }
  .card.dim { opacity:.7; }
  .card.volatile { background:rgba(255,255,255,.05); border:1.2px dashed rgba(255,255,255,.35); }
  .card .who { font-size:11px; letter-spacing:.08em; font-weight:600; display:flex; align-items:center; gap:6px; margin-bottom:7px; }
  .card .who i { width:8px; height:8px; border-radius:50%; display:inline-block; }
  .card .txt { font-size:17px; line-height:1.45; }
  .card.dim .txt { font-size:15px; }
  .card .txt .k0 { color:#fff; } .card .txt .k1 { color:#fff; border-radius:3px; } .card .txt .k2 { color:rgba(255,255,255,.42); }
  .card .tr { margin-top:7px; padding-left:10px; border-left:2px solid; font-size:14px; line-height:1.4; color:rgba(255,255,255,.78); opacity:0; transform:translateY(10px); transition:opacity .42s, transform .42s; }
  .card .tr.on { opacity:1; transform:none; }

  /* ===== 縦スクロールの構成(setlog 型): 1 繋がろう → 2 通話デモ → 3 置いて話す → 4 アプリを入れる ===== */
  .sec { padding:28px 20px; text-align:center; }
  .hero { padding-top:max(44px, env(safe-area-inset-top)); padding-bottom:18px; }
  .hero img.icon { width:64px; height:64px; border-radius:16px; box-shadow:0 8px 24px rgba(0,0,0,.5); margin:0 auto 14px; display:block; }
  h1 { font-family:Georgia,"Hiragino Mincho ProN","Noto Serif JP",serif; font-weight:400; font-size:28px; line-height:1.3; margin:0 0 10px; }
  .lead { color:var(--sub); font-size:15px; line-height:1.65; margin:0 0 16px; }
  .inviter { display:flex; align-items:center; justify-content:center; gap:10px; margin:0 0 16px; font-size:15px; }
  .inviter .who { font-weight:700; }
  .inviter .uname { font-family:ui-monospace,Menlo,monospace; color:var(--sub); font-size:13px; }
  .btn { display:block; width:100%; padding:16px; border-radius:16px; border:0; font-size:16px; font-weight:700; cursor:pointer; text-decoration:none; margin-bottom:10px; transition:transform .05s ease; }
  .btn:active { transform:scale(.98); }
  .btn-primary { background:#fff; color:var(--bg); box-shadow:0 8px 24px rgba(0,0,0,.35); }
  .btn-store { background:rgba(255,255,255,.10); color:#fff; border:1px solid rgba(255,255,255,.28); }
  .scrollHint { color:rgba(255,255,255,.45); font-size:12px; letter-spacing:.1em; margin-top:8px; }
  .scrollHint::after { content:"↓"; display:block; font-size:16px; margin-top:2px; animation:bob 1.6s ease-in-out infinite; }
  @keyframes bob { 0%,100%{ transform:translateY(0) } 50%{ transform:translateY(5px) } }
  .feat .num { font-family:ui-monospace,Menlo,monospace; font-size:12px; letter-spacing:.2em; color:rgba(255,255,255,.5); margin-bottom:8px; }
  .feat h2 { font-family:Georgia,"Hiragino Mincho ProN","Noto Serif JP",serif; font-weight:400; font-size:24px; margin:0 0 10px; }
  .feat p { color:var(--sub); font-size:14.5px; line-height:1.7; margin:0 auto 18px; max-width:340px; }
  .stageWrap { position:relative; width:100%; height:600px; overflow:hidden; border-radius:28px; }   /* 高さは JS が幅から決める */
  .stage { position:absolute; left:0; top:0; width:390px; height:693px; transform-origin:0 0; overflow:hidden; }
  .fade { position:absolute; left:0; right:0; bottom:0; height:22%; background:linear-gradient(rgba(14,13,18,0), var(--bg) 85%); pointer-events:none; }
  .f2f { position:relative; width:100%; border-radius:28px; overflow:hidden; aspect-ratio:9/16; max-height:560px; background:#000; }
  .f2f video { width:100%; height:100%; object-fit:cover; display:block; }
  .f2f .cap { position:absolute; left:0; right:0; bottom:0; padding:40px 18px 18px; background:linear-gradient(rgba(0,0,0,0), rgba(0,0,0,.75)); text-align:left; }
  .f2f .cap b { display:block; font-family:Georgia,"Hiragino Mincho ProN","Noto Serif JP",serif; font-weight:400; font-size:22px; margin-bottom:6px; }
  .f2f .cap span { font-size:13px; color:rgba(255,255,255,.85); line-height:1.6; }
  .sep { display:flex; align-items:center; gap:10px; margin:6px 0 14px; }
  .sep::before, .sep::after { content:""; flex:1; height:1px; background:rgba(255,255,255,.14); }
  .sep span { font-size:12px; color:var(--sub); }
  .qrWrap { display:none; margin:0 auto 14px; width:168px; padding:10px; background:#fff; border-radius:18px; }
  .qrWrap canvas, .qrWrap img { width:148px !important; height:148px !important; display:block; }
  .codeWrap { display:none; margin:6px 0 4px; }
  .codeLabel { font-size:13px; font-weight:700; margin-bottom:8px; }
  .codePill { display:flex; align-items:center; justify-content:center; gap:10px; width:100%; padding:16px; border-radius:14px; cursor:pointer; background:rgba(255,255,255,.08); border:1.5px solid rgba(255,255,255,.28); font-family:ui-monospace,Menlo,monospace; font-size:22px; font-weight:700; letter-spacing:.06em; color:#fff; }
  .codePill:active { transform:scale(.98); }
  .codeHint { font-size:12.5px; color:var(--sub); margin:10px 0 16px; line-height:1.6; }
  .copied { color:#7FE3CB; font-weight:700; }
  .hint { font-size:12px; color:var(--sub); margin-top:10px; line-height:1.6; }
</style>

  var SEC = {"ja": ["リアルタイム翻訳通話", "話した言葉がその場で文字になって、あなたの言語の字幕に。言葉が違っても、仲良くなれます！", "置いて、話す", "ネットで知り合った人とも、居酒屋で声をかけた人とも。イヤホンを左右でシェアすれば、相手の話したことがリアルタイムであなたの母語に。そのまま遊びに行けます"], "ko": ["실시간 번역 통화", "말한 내용이 그 자리에서 글자가 되고, 내 언어의 자막으로. 언어가 달라도 친해질 수 있어요!", "놓고, 이야기하기", "인터넷에서 만난 사람도, 술집에서 말을 건 사람도. 이어폰을 한쪽씩 나눠 끼면 상대의 말이 실시간으로 내 모국어로. 그대로 놀러 갈 수 있어요"], "en": ["Live translated calls", "What you say turns into text on the spot, with subtitles in your language. Different languages, still close friends!", "Set it down and talk", "Someone you met online, or someone you said hi to at a bar. Share one earbud each, and what they say arrives in your language in real time. Then just go hang out"], "zh": ["实时翻译通话", "说的话当场变成文字，并显示成你语言的字幕。语言不同，也能成为好朋友！", "放下手机，直接聊", "网上认识的人也好，居酒屋里搭话的人也好。一人一只耳机，对方说的话就会实时变成你的母语。然后直接去玩吧"], "zh-TW": ["即時翻譯通話", "說的話當場變成文字，並顯示成你語言的字幕。語言不同，也能成為好朋友！", "放下手機，直接聊", "網路上認識的人也好，居酒屋裡搭話的人也好。一人一隻耳機，對方說的話就會即時變成你的母語。然後直接去玩吧"], "yue": ["即時翻譯通話", "講嘅嘢即刻變成文字，仲有你語言嘅字幕。語言唔同，都可以做好朋友！", "放低電話，直接傾", "網上識嘅人又好，居酒屋搭訕嘅人又好。一人一隻耳機，對方講嘅嘢即時變成你嘅母語。跟住直接去玩啦"], "vi": ["Gọi điện dịch trực tiếp", "Lời bạn nói được chuyển thành chữ ngay lập tức, kèm phụ đề bằng ngôn ngữ của bạn. Khác ngôn ngữ vẫn thân nhau được!", "Đặt máy xuống và trò chuyện", "Người quen trên mạng hay người bạn bắt chuyện ở quán. Mỗi người một bên tai nghe, lời họ nói đến với bạn bằng tiếng mẹ đẻ theo thời gian thực. Rồi cứ thế đi chơi thôi"], "th": ["โทรแปลภาษาแบบเรียลไทม์", "สิ่งที่พูดกลายเป็นตัวอักษรทันที พร้อมคำบรรยายภาษาของคุณ ภาษาต่างกันก็สนิทกันได้!", "วางมือถือแล้วคุยกันเลย", "คนที่รู้จักในเน็ต หรือคนที่ทักในร้านเหล้า แบ่งหูฟังกันคนละข้าง สิ่งที่เขาพูดจะกลายเป็นภาษาแม่ของคุณแบบเรียลไทม์ แล้วไปเที่ยวด้วยกันได้เลย"], "my": ["တိုက်ရိုက် ဘာသာပြန် ခေါ်ဆိုမှု", "ပြောလိုက်တာ ချက်ချင်း စာသားဖြစ်ပြီး သင့်ဘာသာစကား စာတန်းထိုးနဲ့ ပေါ်ပါတယ်။ ဘာသာစကား မတူလည်း ရင်းနှီးနိုင်တယ်!", "ချထားပြီး စကားပြောပါ", "အွန်လိုင်းမှာ သိလိုက်တဲ့သူပဲဖြစ်ဖြစ်၊ ဘားမှာ စကားစလိုက်တဲ့သူပဲဖြစ်ဖြစ်။ နားကြပ်ကို တစ်ဖက်စီ ဝေယူရင် သူပြောတာက သင့်မိခင်ဘာသာစကားနဲ့ တိုက်ရိုက် ရောက်လာပါတယ်။ ပြီးရင် အတူတူ လျှောက်လည်ရုံပဲ"], "km": ["ការហៅបកប្រែផ្ទាល់", "អ្វីដែលអ្នកនិយាយក្លាយជាអក្សរភ្លាមៗ ជាមួយអក្សររត់ជាភាសារបស់អ្នក។ ភាសាខុសគ្នា ក៏ស្និទ្ធស្នាលបាន!", "ដាក់ទូរស័ព្ទចុះ ហើយនិយាយ", "មនុស្សដែលស្គាល់តាមអ៊ីនធឺណិត ឬអ្នកដែលអ្នកទៅនិយាយជាមួយនៅហាង។ ចែកកាសម្នាក់ម្ខាង អ្វីដែលគេនិយាយមកដល់អ្នកជាភាសាកំណើតភ្លាមៗ។ រួចទៅលេងជាមួយគ្នាតែម្តង"], "ms": ["Panggilan terjemahan langsung", "Apa yang anda cakap terus jadi teks, dengan sari kata dalam bahasa anda. Bahasa berbeza, tetap boleh rapat!", "Letak telefon, terus berbual", "Orang yang dikenali dalam talian, atau orang yang anda tegur di bar. Kongsi earbud sebelah seorang, apa yang mereka cakap sampai dalam bahasa ibunda anda serta-merta. Lepas tu terus pergi jalan-jalan"], "hi": ["रियल-टाइम अनुवाद कॉल", "जो बोलो वह तुरंत टेक्स्ट बनकर आपकी भाषा के सबटाइटल में। भाषा अलग, फिर भी करीबी दोस्त!", "फ़ोन रखो और बात करो", "ऑनलाइन मिला कोई हो या बार में जिससे बात की। एक-एक ईयरबड बाँट लो, उसकी बात रियल-टाइम में आपकी मातृभाषा में। फिर साथ घूमने निकल जाओ"], "si": ["සජීවී පරිවර්තන ඇමතුම්", "කියන දේ එතැනම අකුරු වී, ඔබේ භාෂාවෙන් උපසිරැසි ලෙස. භාෂා වෙනස් වුණත් යාළු වෙන්න පුළුවන්!", "තබලා, කතා කරන්න", "අන්තර්ජාලයෙන් හමුවුණු කෙනෙක් වුණත්, බාර් එකේදී කතා කළ කෙනෙක් වුණත්. ඉයර්බඩ් එක බැගින් බෙදාගත්තොත්, ඔවුන් කියන දේ සජීවීව ඔබේ මව්බසින්. ඉන්පසු එකට යන්න"], "ur": ["ریئل ٹائم ترجمہ کال", "جو بولو وہ فوراً متن بن کر آپ کی زبان کے سب ٹائٹل میں۔ زبان الگ، پھر بھی قریبی دوست!", "فون رکھو اور بات کرو", "آن لائن ملا کوئی ہو یا بار میں جس سے بات کی۔ ایک ایک ایئربڈ بانٹ لو، اس کی بات ریئل ٹائم میں آپ کی مادری زبان میں۔ پھر ساتھ گھومنے نکل جاؤ"], "mn": ["Шууд орчуулгатай дуудлага", "Хэлсэн үг тэр дороо текст болж, таны хэл дээрх хадмал гарна. Хэл өөр ч дотно найз болж чадна!", "Утсаа тавиад, ярь", "Онлайнаар танилцсан хүн ч бай, бааранд мэндэлсэн хүн ч бай. Чихэвчээ нэг нэгээр хуваалцвал тэдний хэлсэн үг таны эх хэл дээр шууд ирнэ. Дараа нь хамт зугаалаад л"], "pt-BR": ["Ligações com tradução ao vivo", "O que você diz vira texto na hora, com legendas no seu idioma. Línguas diferentes, mesmo assim amigos próximos!", "Deixa o celular na mesa e conversa", "Alguém que você conheceu online ou puxou papo no bar. Um fone para cada um, e o que a pessoa diz chega na sua língua em tempo real. Depois é só sair pra curtir"], "fr": ["Appels traduits en direct", "Ce que vous dites devient du texte à l'instant, avec des sous-titres dans votre langue. Des langues différentes, mais proches quand même !", "Posez le téléphone et parlez", "Quelqu'un rencontré en ligne ou abordé dans un bar. Un écouteur chacun, et ce qu'il dit vous arrive dans votre langue en temps réel. Ensuite, allez traîner ensemble"], "ru": ["Звонки с живым переводом", "Сказанное сразу становится текстом с субтитрами на вашем языке. Разные языки, но всё равно близкие друзья!", "Положи телефон и говори", "Знакомый из интернета или тот, с кем вы заговорили в баре. По одному наушнику каждому — и его слова приходят на вашем родном языке в реальном времени. А дальше — просто идите гулять"], "id": ["Panggilan terjemahan langsung", "Yang kamu ucapkan langsung jadi teks, dengan subtitle dalam bahasamu. Beda bahasa, tetap bisa akrab!", "Taruh HP, langsung ngobrol", "Orang yang kenal online, atau yang kamu sapa di bar. Bagi earbud satu-satu, ucapan mereka sampai dalam bahasa ibumu secara real-time. Habis itu langsung main bareng"], "fil": ["Live translated na tawag", "Ang sinabi mo ay agad nagiging text, may subtitles sa wika mo. Magkaiba ang wika, malapit pa rin!", "Ilapag at mag-usap", "Kakilala online, o taong kinausap mo sa bar. Tig-isang earbud, at ang sinasabi nila ay dumarating sa sarili mong wika nang real time. Tapos lakad na"], "ne": ["रियल-टाइम अनुवाद कल", "बोलेको कुरा तुरुन्तै अक्षरमा, तपाईंको भाषाको सबटाइटलसहित। भाषा फरक, तर पनि नजिकका साथी!", "राखेर, कुरा गर्नुहोस्", "अनलाइनमा भेटेको मान्छे होस् वा बारमा बोलाएको मान्छे। इयरबड एक-एक बाँडे उसले भनेको कुरा रियल-टाइममा तपाईंको मातृभाषामा। त्यसपछि सँगै घुम्न जानुहोस्"], "es": ["Llamadas con traducción en vivo", "Lo que dices se convierte en texto al instante, con subtítulos en tu idioma. Idiomas distintos, amigos cercanos igual!", "Deja el móvil y habla", "Alguien que conociste en línea o a quien saludaste en un bar. Un auricular cada uno, y lo que dice te llega en tu idioma en tiempo real. Luego, a salir juntos"], "de": ["Anrufe mit Live-Übersetzung", "Was du sagst, wird sofort zu Text – mit Untertiteln in deiner Sprache. Verschiedene Sprachen, trotzdem enge Freunde!", "Handy hinlegen und reden", "Jemand aus dem Internet oder jemand, den du in der Bar angesprochen hast. Je ein Ohrhörer, und was die Person sagt, kommt in Echtzeit in deiner Sprache an. Danach einfach losziehen"], "nl": ["Bellen met live vertaling", "Wat je zegt wordt meteen tekst, met ondertitels in jouw taal. Andere taal, toch goede vrienden!", "Leg je telefoon neer en praat", "Iemand die je online kent of aansprak in een bar. Ieder één oortje, en wat de ander zegt komt live in jouw taal binnen. Daarna gewoon samen op stap"], "fa": ["تماس با ترجمه زنده", "چیزی که می‌گویی همان لحظه متن می‌شود، با زیرنویس به زبان خودت. زبان‌های متفاوت، باز هم دوستان صمیمی!", "گوشی را بگذار و حرف بزن", "کسی که آنلاین آشنا شدی یا کسی که در بار سر صحبت را باز کردی. هر کدام یک هندزفری، و حرف‌هایش همان لحظه به زبان مادری‌ات می‌رسد. بعدش هم با هم بروید بگردید"]};

  $("wmSub").textContent = ({ja:"翻訳通話",ko:"번역 통화",zh:"翻译通话","zh-TW":"翻譯通話",yue:"翻譯通話"})[lang] || "Translated call";

  if (validCode) {
    $("codeWrap").style.display = "block";

    $("codePill").addEventListener("click", function () {

  }
  // QR = このページの URL(別の端末で読めるように)。
  if (id && window.QRCode) {

          new QRCode($("qrWrap"), { text: location.href, width: 148, height: 148, correctLevel: QRCode.CorrectLevel.M }); } catch (e) {}
  }

  // --- アプリを開く / App Store。流入元パラメータは全部アプリへ引き継ぐ(AttributionManager.handle が読む)。 ---
  var fwd = [];
  function addParam(k, v) { v = (v || "").trim(); if (v) fwd.push(encodeURIComponent(k) + "=" + encodeURIComponent(v)); }
  addParam("id", id); addParam("u", uname);
  ["source", "channel", "campaign", "invite_code", "inviter_user_id", "inviter_username"].forEach(function (k) { addParam(k, params.get(k)); });
  if (id && !params.get("inviter_user_id")) addParam("inviter_user_id", id);
  if (!params.get("source")) addParam("source", "friend_invite");
  var appURL = fwd.length ? ("shotlingua://add?" + fwd.join("&")) : "shotlingua://";
  var storeURL = "https://apps.apple.com/app/id6760792510";
  $("openApp").setAttribute("href", appURL);
  var ua = navigator.userAgent || "";
  var inApp = /Instagram|FBAN|FBAV|Line\//i.test(ua);
  var isIOS = /iPhone|iPad|iPod/i.test(ua);
  if (inApp) $("hint").textContent = T.inApp;
  $("openApp").addEventListener("click", tryOpenApp);
  // コードがある時は自動遷移しない(コピーする前にページを離れさせない)。
  if (isIOS && !inApp && id && !validCode) setTimeout(tryOpenApp, 350);
  function tryOpenApp(e) {

    window.location.href = appURL;
    window.addEventListener("pagehide", function () { clearTimeout(t); });
  }
  function copyText(text, done) {

    else legacyCopy(text, done);
  }
  function legacyCopy(text, done) {

    ta.style.position = "fixed"; ta.style.opacity = "0"; document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); done(); } catch (err) {}
    document.body.removeChild(ta);
  }

  // ===== デモ(CallDemoScript と同じ台本を 14 秒でループ) =====
  var fb = (lang === "ja" || lang === "ko") ? lang : "en";
  var partnerLang = fb === "en" ? "ja" : "en";               // 見る人が英語なら相手は日本語で話す
  var partnerIsSoyeon = partnerLang !== "en";                 // 日本語で話す相手はハルカ(ソヨンの顔)
  var P = PARTNER[partnerLang];
  var partnerName = partnerIsSoyeon ? W.haruka : W.michael;
  var partnerImg = partnerIsSoyeon ? "demo-soyeon.jpg" : "demo-michael.jpg";
  var partnerCode = partnerLang.toUpperCase(), myCode = lang.slice(0,2).toUpperCase();
  var ME = "me", PA = "pa";
  function chunks(s) { if (s.indexOf(" ") >= 0) return s.split(" ").map(function (w) { return w + " "; }); var o = [], c = ""; for (var i = 0; i < s.length; i++) { c += s[i]; if (c.length >= 2) { o.push(c); c = ""; } } if (c) o.push(c); return o; }
  var LEN = 14;
  var ev = [];
  function E(t, k, v) { ev.push({t:t, k:k, v:v}); }
  E(0.30, "spk", PA); E(0.30, "line", {id:"p1", uid:PA, text:P.p1}); E(1.80, "tr", {id:"p1", text:W.t1});
  E(4.60, "spk", ME);
  var m1c = chunks(W.m1); for (var i = 0; i < m1c.length; i++) E(4.60 + 1.3 * (i + 1) / m1c.length, "vol", m1c.slice(0, i + 1).join(""));
  E(6.00, "vol", ""); E(6.00, "line", {id:"m1", uid:ME, text:W.m1});
  E(7.40, "spk", PA); E(7.40, "line", {id:"p2", uid:PA, text:P.p2}); E(8.90, "tr", {id:"p2", text:W.t2});
  E(11.60, "spk", ME);
  var m2c = chunks(W.m2); for (var j = 0; j < m2c.length; j++) E(11.60 + 1.0 * (j + 1) / m2c.length, "vol", m2c.slice(0, j + 1).join(""));
  E(12.70, "vol", ""); E(12.70, "line", {id:"m2", uid:ME, text:W.m2});
  var speaking = [[0.30,1.70,PA],[4.60,5.95,ME],[7.40,8.80,PA],[11.60,12.65,ME]];
  function level(t, uid) { var best = 0; for (var s = 0; s < speaking.length; s++) { var r = speaking[s]; if (r[2] !== uid || t < r[0] || t > r[1]) continue; var env = Math.min(1, (t - r[0]) / .25) * Math.min(1, (r[1] - t) / .3 + .2); var w = .55 + .45 * Math.abs(Math.sin(t * 34) * Math.cos(t * 12)); best = Math.max(best, env * w); } return best; }
  function state(t) {
    var st = {spk:PA, prev:null, changedAt:-10, lines:[], order:[], tr:{}, vol:"", lineAt:{}};
    for (var i = 0; i < ev.length; i++) { var e = ev[i]; if (e.t > t) continue;
      if (e.k === "line") { st.lines.push(e.v); st.lineAt[e.v.id] = e.t; }
      else if (e.k === "tr") st.tr[e.v.id] = {text:e.v.text, at:e.t};
      else if (e.k === "vol") st.vol = e.v;
      else if (e.k === "spk" && st.spk !== e.v) { st.prev = st.spk; st.spk = e.v; st.changedAt = e.t; } }
    st.lines = st.lines.slice(-2); st.level = level(t, st.spk); return st;
  }
  function easeOutBack(x) { var c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); }
  function blobPath(phase, amp, seed, R) { var pts = []; for (var i = 0; i < 72; i++) { var th = i / 72 * Math.PI * 2; var r = R * (1 + amp * Math.sin(3 * th + phase + seed) + amp * .7 * Math.sin(5 * th - 1.3 * phase + seed * 2)); pts.push([95 + r * Math.cos(th), 95 + r * Math.sin(th)]); } var d = "M" + pts[0][0].toFixed(1) + " " + pts[0][1].toFixed(1); for (var k = 1; k < pts.length; k++) d += "L" + pts[k][0].toFixed(1) + " " + pts[k][1].toFixed(1); return d + "Z"; }
  var colors = {me:["#1FA398","#7FE3CB"], pa:[partnerIsSoyeon ? "#6C4DF5" : "#E8604C", partnerIsSoyeon ? "#B9A8FF" : "#FFB3A6"]};
  var imgs = {me:"demo-me.jpg", pa:partnerImg}, names = {me:W.you, pa:partnerName}, codes = {me:myCode, pa:partnerCode};
  var stage = $("stage"), cards = $("cards"), lastKey = "";
  function fit() { var w = stage.parentNode.clientWidth, k = Math.min(w, 430) / 390; stage.style.transform = "scale(" + k + ")"; stage.style.left = ((w - 390 * k) / 2) + "px"; stage.parentNode.style.height = Math.round(693 * k) + "px"; }
  fit(); window.addEventListener("resize", fit);
  var t0 = performance.now();
  function frame(now) {
    var t = ((now - t0) / 1000) % LEN, st = state(t);
    var col = colors[st.spk][0], colL = colors[st.spk][1];
    var p = Math.min(1, Math.max(0, (t - st.changedAt) / .5)), sc = .6 + .4 * easeOutBack(p);
    var amp = .035 + .16 * st.level;
    $("blobA").setAttribute("d", blobPath(t * 1.1, amp, 0, 95 * sc)); $("blobA").setAttribute("fill", col); $("blobA").setAttribute("opacity", (.35 + .15 * st.level) * Math.min(1, p / .35));
    $("blobB").setAttribute("d", blobPath(-t * .9, amp * .85, 1.7, 78 * sc)); $("blobB").setAttribute("fill", col); $("blobB").setAttribute("opacity", (.55 + .15 * st.level) * Math.min(1, p / .35));
    $("glow").style.background = col; $("glow2").style.background = col;
    var lis = st.spk === ME ? PA : ME;
    var key = st.spk + "|" + st.lines.map(function (l) { return l.id; }).join(",") + "|" + Object.keys(st.tr).length + "|" + st.vol;
    if (key !== lastKey) { lastKey = key;
      $("speakerImg").src = imgs[st.spk]; $("spkName").textContent = names[st.spk] + " · " + codes[st.spk]; $("spkLabel").style.color = colL;
      $("listenerImg").src = imgs[lis]; $("listenerName").textContent = names[lis] + " · " + codes[lis]; $("listenerName").style.color = colors[lis][1];
      var h = "";
      for (var i = 0; i < st.lines.length; i++) { var l = st.lines[i], latest = i === st.lines.length - 1, c = colors[l.uid];
        var since = t - st.lineAt[l.id], cs = chunks(l.text), reveal = (latest && l.uid === PA && since < cs.length * .06 + .2) ? Math.min(cs.length, Math.floor(since / .06)) : -1;
        var txt = ""; for (var k = 0; k < cs.length; k++) { var cls = reveal < 0 || k < reveal ? "k0" : (k === reveal ? "k1" : "k2"); txt += '<span class="' + cls + '"' + (cls === "k1" ? ' style="background:' + c[0] + '73"' : "") + '>' + esc(cs[k]) + '</span>'; }
        var tr = st.tr[l.id]; var trHtml = tr ? '<div class="tr ' + ((t - tr.at) > .02 ? "on" : "") + '" style="border-color:' + c[0] + '">' + esc(tr.text) + '</div>' : "";
        h += '<div class="card' + (latest ? "" : " dim") + '"><div class="who" style="color:' + c[1] + '"><i style="background:' + c[0] + '"></i>' + esc(names[l.uid]) + '</div><div class="txt">' + txt + '</div>' + trHtml + '</div>'; }
      if (st.vol) { var vc = chunks(st.vol), vt = ""; for (var q = 0; q < vc.length; q++) vt += '<span class="' + (q < vc.length - 1 ? "k0" : "k1") + '"' + (q === vc.length - 1 ? ' style="background:#1FA39873"' : "") + '>' + esc(vc[q]) + '</span>';
        h += '<div class="card volatile"><div class="who" style="color:#7FE3CB"><i style="background:#1FA398"></i>' + esc(W.you) + '</div><div class="txt">' + vt + '</div></div>'; }
      cards.innerHTML = h;
      var trs = cards.querySelectorAll(".tr:not(.on)"); if (trs.length) requestAnimationFrame(function () { for (var z = 0; z < trs.length; z++) trs[z].classList.add("on"); });
    } else {
      // 途中経過だけ差し替える(カラオケの進み)
      var latestCard = cards.querySelector(".card:not(.dim):not(.volatile)"); if (latestCard && st.lines.length) { var l2 = st.lines[st.lines.length - 1]; if (l2.uid === PA) { var since2 = t - st.lineAt[l2.id], cs2 = chunks(l2.text); var rev2 = since2 < cs2.length * .06 + .2 ? Math.min(cs2.length, Math.floor(since2 / .06)) : -1; var spans = latestCard.querySelectorAll(".txt span"); for (var y = 0; y < spans.length; y++) { var cls2 = rev2 < 0 || y < rev2 ? "k0" : (y === rev2 ? "k1" : "k2"); if (spans[y].className !== cls2) { spans[y].className = cls2; spans[y].style.background = cls2 === "k1" ? colors[PA][0] + "73" : ""; } } } }
    }
    var bars = $("bars").children; for (var b = 0; b < 3; b++) { bars[b].style.height = (4 + 8 * Math.abs(Math.sin(t * 6 + b)) * (.4 + .6 * st.level)) + "px"; bars[b].style.background = colL; }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]; }); }
})();
