  .codeWrap { display:none; margin:22px 0 6px; }
  .codeLabel { font-size:13px; font-weight:700; color:var(--ink); margin-bottom:8px; }
  .codePill {
    display:flex; align-items:center; justify-content:center; gap:10px;
    width:100%; padding:16px; border-radius:14px; cursor:pointer;
    background:var(--wash); border:2px solid #ddd3ff;
    font-family:ui-monospace,Menlo,monospace; font-size:22px; font-weight:700;
    letter-spacing:.06em; color:var(--accent);
  }
  .codePill:active { transform:scale(.98); }
  .codeHint { font-size:12.5px; color:var(--sub); margin:10px 0 18px; line-height:1.6; }
  .copied { color:#12a150; font-weight:700; }

  .sep { display:flex; align-items:center; gap:10px; margin:20px 0 14px; }
  .sep::before, .sep::after { content:""; flex:1; height:1px; background:#eceaf5; }
  .sep span { font-size:12px; color:var(--sub); }

    "ne": {titleWith: " — भाषा फरक भए पनि कुरा गर्न सकिन्छ", titlePlain: "भाषा फरक भए पनि कुरा गर्न सकिन्छ", honor: "", sub: "ShotLingua ले तपाईंले भनेको कुरा तुरुन्तै अनुवाद गर्छ 🌏", open: "एपमा खोल्नुहोस्", sep: "एप छैन?", codeLabel: "उहाँको ID कपी गर्नुहोस्", codeHint: "एप इन्स्टल गरेर यो ID हाल्नुहोस्", copied: "कपी भयो!", store: "App Store बाट डाउनलोड गर्नुहोस्", inApp: "नखुले माथि दायाँ “…” थिचेर “ब्राउजरमा खोल्नुहोस्” रोज्नुहोस्।"},
    "es": {titleWith: " — hablad aunque no compartáis idioma", titlePlain: "Habla aunque no compartáis idioma", honor: "", sub: "ShotLingua traduce lo que dices, al momento 🌏", open: "Abrir en la app", sep: "¿Aún no tienes la app?", codeLabel: "Copiar su ID", codeHint: "Instala la app y escribe este ID", copied: "¡Copiado!", store: "Descargar en el App Store", inApp: "Si no se abre, toca «…» arriba a la derecha y elige «Abrir en el navegador»."},
    "de": {titleWith: " — sprecht auch ohne gemeinsame Sprache", titlePlain: "Sprich auch ohne gemeinsame Sprache", honor: "", sub: "ShotLingua übersetzt, was du sagst — sofort 🌏", open: "In der App öffnen", sep: "Noch keine App?", codeLabel: "ID kopieren", codeHint: "App installieren und diese ID eingeben", copied: "Kopiert!", store: "Im App Store laden", inApp: "Falls es nicht öffnet, tippe oben rechts auf „…“ und wähle „Im Browser öffnen“."},
    "nl": {titleWith: " — praat ook zonder gemeenschappelijke taal", titlePlain: "Praat ook zonder gemeenschappelijke taal", honor: "", sub: "ShotLingua vertaalt wat je zegt, meteen 🌏", open: "In de app openen", sep: "Nog geen app?", codeLabel: "ID kopiëren", codeHint: "Installeer de app en voer deze ID in", copied: "Gekopieerd!", store: "Downloaden in de App Store", inApp: "Lukt het niet? Tik rechtsboven op “…” en kies “Openen in browser”."},
    "fa": {titleWith: " — حتی بدون زبان مشترک گفت‌وگو کنید", titlePlain: "حتی بدون زبان مشترک گفت‌وگو کنید", honor: "", sub: "ShotLingua آنچه می‌گویید را همان لحظه ترجمه می‌کند 🌏", open: "باز کردن در برنامه", sep: "هنوز برنامه را ندارید؟", codeLabel: "کپی کردن شناسه او", codeHint: "برنامه را نصب کنید و این شناسه را وارد کنید", copied: "کپی شد!", store: "دانلود از App Store", inApp: "اگر باز نشد، بالا سمت راست «…» را بزنید و «باز کردن در مرورگر» را انتخاب کنید."},
  };

  // ⚠️ STRINGS は **必ず言語判定より前** に置くこと。`var` は宣言だけ巻き上げて
  //  代入は巻き上げないため、下の判定内 `STRINGS[base]` が undefined を触って
  //  TypeError で **スクリプト全体が停止** する (名前もIDのコピー欄も出なくなる)。
  // 端末言語 → 表示言語。zh-TW / pt-BR のように地域まで見ないと別言語になるものが
  // あるので、まず完全一致、次に主言語、最後に英語の順で解決する。
  var raw = (navigator.language || "en").toLowerCase();
  var lang = (function () {
    var exact = { "zh-tw": "zh-TW", "zh-hant": "zh-TW", "zh-hk": "yue",
                  "pt-br": "pt-BR", "pt": "pt-BR", "tl": "fil" };
    if (exact[raw]) return exact[raw];
    var base = raw.split("-")[0];
    if (exact[base]) return exact[base];
    if (base === "zh") return raw.indexOf("hant") >= 0 ? "zh-TW" : "zh";
    return STRINGS[base] ? base : "en";
  })();
  // アラビア文字系は右から左へ。ここを入れないと句読点と記号が行末で乱れる。
  if (lang === "ur" || lang === "fa") document.documentElement.setAttribute("dir", "rtl");
  document.documentElement.setAttribute("lang", lang);

  var T = STRINGS[lang] || STRINGS.en;

  var $ = function (elId) { return document.getElementById(elId); };

  $("title").innerHTML = name
    ? '<span class="who">' + escapeHtml(name) + T.honor + "</span>" + T.titleWith
    : T.titlePlain;
  if (uname) $("uname").textContent = "@" + uname;
  $("sub").textContent      = T.sub;
  $("openApp").textContent  = T.open;
  $("sepText").textContent  = T.sep;
  $("codeLabel").textContent = T.codeLabel;
  $("codeHint").textContent  = T.codeHint;
  $("store").textContent     = T.store;

  // --- ID 欄 (ID がリンクに乗っている時だけ出す) ---
  if (validCode) {
    $("codeWrap").style.display = "block";
    $("codeText").textContent = "@" + code;
    $("codePill").addEventListener("click", function () {
      copyText("@" + code, function () {
        var hint = $("codeHint");
        hint.textContent = T.copied;
        hint.classList.add("copied");
        setTimeout(function () {
          hint.textContent = T.codeHint;
          hint.classList.remove("copied");
        }, 1800);
      });
    });
  }

  // --- アプリを開く / App Store (Google Play は Android 版が無いので載せない) ---
  // 【アトリビューション】友達追加(id) に加えて **流入元パラメータも全部アプリへ引き継ぐ**。
  // アプリ側 AttributionManager.handle が source/channel/campaign/invite_code/inviter_* を解析する。
  // これが無いと、インストールが招待経由なのか App Store 検索なのか区別できない
  // (実測: first_open_attributed は 122 件すべて organic_or_unknown だった)。
  // ⚠️ サイト側リポジトリ (-shotlingua-site) の未コミット実装を移植したもの。消さないこと。
  var fwd = [];
  function addParam(k, v) { v = (v || "").trim(); if (v) fwd.push(encodeURIComponent(k) + "=" + encodeURIComponent(v)); }
  addParam("id", id);
  addParam("u", uname);
  ["source", "channel", "campaign", "invite_code", "inviter_user_id", "inviter_username"].forEach(function (k) {
    addParam(k, params.get(k));
  });
  // inviter_user_id が未指定なら、招待リンクの id を招待主として渡す (旧リンク互換)。
  if (id && !params.get("inviter_user_id")) addParam("inviter_user_id", id);
  // 明示 source が無い招待リンクは friend_invite とみなす。
  if (!params.get("source")) addParam("source", "friend_invite");
  var appURL = fwd.length ? ("shotlingua://add?" + fwd.join("&")) : "shotlingua://";
  var storeURL = "https://apps.apple.com/app/id6760792510";
  $("openApp").setAttribute("href", appURL);

  var ua    = navigator.userAgent || "";
  var inApp = /Instagram|FBAN|FBAV|Line\//i.test(ua);
  var isIOS = /iPhone|iPad|iPod/i.test(ua);

  // Instagram/LINE 等の in-app ブラウザはカスタムスキーム遷移を抑制しがち。
  if (inApp) $("hint").textContent = T.inApp;

  $("openApp").addEventListener("click", tryOpenApp);
  // 【重要】コードがある時は自動遷移しない。未インストールの人を勝手に App Store へ
  // 飛ばすと、**コードをコピーする前にページを離れてしまう**。インストールを挟むと
  // URL は失われるので、そこでコードを取り逃すと二度と紐付かない。
  if (isIOS && !inApp && id && !validCode) setTimeout(tryOpenApp, 350);

  function tryOpenApp(e) {
    if (e) e.preventDefault();
    var start = Date.now();
    var t = setTimeout(function () {
      if (Date.now() - start < 1600) location.href = storeURL;
    }, 1200);
    window.location.href = appURL;
    window.addEventListener("pagehide", function () { clearTimeout(t); });
  }

  // navigator.clipboard は非 https / 古い in-app ブラウザで落ちるので必ず退避策を持つ。
  function copyText(text, done) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, function () { legacyCopy(text, done); });
    } else {
      legacyCopy(text, done);
    }
  }
  function legacyCopy(text, done) {
    var ta = document.createElement("textarea");
    ta.value = text;
    ta.setAttribute("readonly", "");
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand("copy"); done(); } catch (err) { /* 失敗しても文字は見えている */ }
    document.body.removeChild(ta);
  }

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, function (c) {
      return { "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c];
    });
  }
})();
</script>
