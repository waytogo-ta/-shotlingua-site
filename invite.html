  .codeWrap { display:none; margin:6px 0 4px; }
  .codeLabel { font-size:13px; font-weight:700; margin-bottom:8px; }
  .codePill { display:flex; align-items:center; justify-content:center; gap:10px; width:100%; padding:16px; border-radius:14px; cursor:pointer; background:rgba(255,255,255,.08); border:1.5px solid rgba(255,255,255,.28); font-family:ui-monospace,Menlo,monospace; font-size:22px; font-weight:700; letter-spacing:.06em; color:#fff; }

      for (var i = 0; i < st.lines.length; i++) { var l = st.lines[i], latest = i === st.lines.length - 1, c = colors[l.uid];
        var since = t - st.lineAt[l.id], cs = chunks(l.text), reveal = (latest && l.uid === PA && since < cs.length * .06 + .2) ? Math.min(cs.length, Math.floor(since / .06)) : -1;
        var txt = ""; for (var k = 0; k < cs.length; k++) { var cls = reveal < 0 || k < reveal ? "k0" : (k === reveal ? "k1" : "k2"); txt += '<span class="' + cls + '"' + (cls === "k1" ? ' style="background:' + c[0] + '73"' : "") + '>' + esc(cs[k]) + '</span>'; }
        var tr = st.tr[l.id]; var trHtml = tr ? '<div class="tr ' + ((t - tr.at) > .02 ? "on" : "") + '" style="border-color:' + c[0] + '">' + esc(tr.text) + '</div>' : "";
        h += '<div class="card' + (latest ? "" : " dim") + '"><div class="who" style="color:' + c[1] + '"><i style="background:' + c[0] + '"></i>' + esc(names[l.uid]) + '</div><div class="txt">' + txt + '</div>' + trHtml + '</div>'; }
      if (st.vol) { var vc = chunks(st.vol), vt = ""; for (var q = 0; q < vc.length; q++) vt += '<span class="' + (q < vc.length - 1 ? "k0" : "k1") + '"' + (q === vc.length - 1 ? ' style="background:#1FA39873"' : "") + '>' + esc(vc[q]) + '</span>';
        h += '<div class="card volatile"><div class="who" style="color:#7FE3CB"><i style="background:#1FA398"></i>' + esc(W.you) + '</div><div class="txt">' + vt + '</div></div>'; }
      cards.innerHTML = h;
      var trs = cards.querySelectorAll(".tr:not(.on)"); if (trs.length) requestAnimationFrame(function () { for (var z = 0; z < trs.length; z++) trs[z].classList.add("on"); });
    } else {
      // 途中経過だけ差し替える(カラオケの進み)
      var latestCard = cards.querySelector(".card:not(.dim):not(.volatile)"); if (latestCard && st.lines.length) { var l2 = st.lines[st.lines.length - 1]; if (l2.uid === PA) { var since2 = t - st.lineAt[l2.id], cs2 = chunks(l2.text); var rev2 = since2 < cs2.length * .06 + .2 ? Math.min(cs2.length, Math.floor(since2 / .06)) : -1; var spans = latestCard.querySelectorAll(".txt span"); for (var y = 0; y < spans.length; y++) { var cls2 = rev2 < 0 || y < rev2 ? "k0" : (y === rev2 ? "k1" : "k2"); if (spans[y].className !== cls2) { spans[y].className = cls2; spans[y].style.background = cls2 === "k1" ? colors[PA][0] + "73" : ""; } } } }
    }
    var bars = $("bars").children; for (var b = 0; b < 3; b++) { bars[b].style.height = (4 + 8 * Math.abs(Math.sin(t * 6 + b)) * (.4 + .6 * st.level)) + "px"; bars[b].style.background = colL; }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]; }); }
})();
