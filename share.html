<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>ShotLingua の話題</title>

<!-- リンクプレビュー (LINE/Messages 等)。静的ページのため内容は汎用 -->
<meta property="og:title" content="ShotLingua で話題の相談 👀" />
<meta property="og:description" content="匿名で相談・交流できるアプリ ShotLingua。続きはアプリで読めます。" />
<meta property="og:type" content="website" />
<meta property="og:site_name" content="ShotLingua" />
<meta property="og:image" content="https://shotlingua.app/appicon.png" />
<meta name="twitter:card" content="summary" />
<meta name="apple-itunes-app" content="app-id=6760792510" />

<style>
  :root { --accent:#6C4DF5; --accent2:#7C5CFC; --ink:#1c1c1e; --sub:#8a8a90; --line:#eeeef2; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; padding:0; }
  body {
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
    background:#fff; color:var(--ink); min-height:100vh;
  }
  .wrap { width:100%; max-width:460px; margin:0 auto; }

  /* 上部ブランドバー (本物のアプリアイコン) */
  .brand { display:flex; align-items:center; gap:9px; padding:14px 18px 10px; }
  .brand img { width:30px; height:30px; border-radius:23%; box-shadow:0 2px 6px rgba(90,63,224,.18); }
  .brand b { font-size:16px; letter-spacing:.2px; }

  /* ルームのカバー(ヒーロー)。アプリのルーム詳細と同じ見せ方 */
  .hero {
    position:relative; height:210px; background:linear-gradient(135deg,#7C5CFC,#5B3FE0);
    background-size:cover; background-position:center; overflow:hidden;
  }
  .hero::after {
    content:""; position:absolute; inset:0;
    background:linear-gradient(to top, rgba(0,0,0,.62) 0%, rgba(0,0,0,.12) 45%, rgba(0,0,0,0) 70%);
  }
  .hero .meta { position:absolute; left:18px; right:18px; bottom:14px; z-index:2; color:#fff; }
  .hero .rname { font-size:26px; font-weight:800; line-height:1.2; margin:0 0 4px; text-shadow:0 1px 6px rgba(0,0,0,.35); }
  .hero .rsub { font-size:13px; opacity:.95; text-shadow:0 1px 4px rgba(0,0,0,.4); }

  .list { padding:6px 18px 0; }
  .msg { display:flex; gap:11px; padding:13px 0; }
  .ava { flex:0 0 36px; width:36px; height:36px; border-radius:50%; background:#eceaf6;
         display:flex; align-items:center; justify-content:center; }
  .ava svg { width:20px; height:20px; fill:#b7b1d6; }
  .msg .body { flex:1; min-width:0; }
  .lbl { display:flex; align-items:center; gap:6px; margin-bottom:4px; }
  .lbl .name { font-size:13px; font-weight:700; color:var(--ink); }
  .lbl .op { font-size:11px; font-weight:700; color:var(--accent); }
  .lbl .time { font-size:10px; color:#b4b4bc; }
  .txt { font-size:15px; line-height:1.65; white-space:pre-wrap; word-break:break-word; color:#26262b; }
  .media { margin-top:8px; font-size:12.5px; color:var(--sub); }
  .media img { max-width:100%; border-radius:14px; display:block; margin-top:4px; }
  .divider { height:1px; background:var(--line); }

  /* 続きを隠すフェード */
  .fade { position:relative; height:120px; margin-top:-96px; pointer-events:none;
          background:linear-gradient(to bottom, rgba(255,255,255,0) 0%, #fff 80%); }

  /* みんなの投稿カード */
  .postwrap { padding:6px 18px 0; }
  .post { border:1px solid var(--line); border-radius:18px; padding:14px; }
  .phead { display:flex; align-items:center; gap:10px; margin-bottom:10px; }
  .phead .pname { font-size:14px; font-weight:700; }
  .ptext { font-size:15.5px; line-height:1.7; white-space:pre-wrap; word-break:break-word; margin-bottom:10px; }
  .pimg { width:100%; border-radius:14px; display:block; }

  .gate { padding:16px 18px 26px; text-align:center; }
  .more { font-size:13.5px; color:var(--sub); margin-bottom:12px; }
  .btn { display:block; width:100%; padding:16px; border-radius:15px; border:0;
         font-size:16px; font-weight:700; cursor:pointer; text-decoration:none;
         margin-bottom:11px; transition:transform .05s ease; }
  .btn:active { transform:scale(.985); }
  .btn-primary { background:var(--accent); color:#fff; box-shadow:0 6px 18px rgba(108,77,245,.28); }
  .btn-store { background:#000; color:#fff; }
  .hint { font-size:12px; color:var(--sub); margin-top:10px; line-height:1.6; }
  .state { text-align:center; color:var(--sub); font-size:14px; padding:60px 24px; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="brand"><img src="appicon.png" alt="" /><b>ShotLingua</b></div>
    <div id="content"><div class="state">読み込み中…</div></div>
  </div>

<script>
(function () {
  var API_KEY = "AIzaSyAodG25aOXTOfwsn0X1RsgHliJ7u0TOhBo"; // Firebase web key (公開情報)
  var PROJECT = "shotlingua-12";
  var STORE_URL = "https://apps.apple.com/app/id6760792510";
  var PERSON = '<svg viewBox="0 0 24 24"><path d="M12 12a5 5 0 100-10 5 5 0 000 10zm0 2c-5 0-9 2.5-9 6v2h18v-2c0-3.5-4-6-9-6z"/></svg>';

  var id = (new URLSearchParams(location.search).get("id") || "").trim();
  var content = document.getElementById("content");
  if (!id) { content.innerHTML = '<div class="state">リンクが正しくありません。</div>'; return; }

  var url = "https://firestore.googleapis.com/v1/projects/" + PROJECT +
            "/databases/(default)/documents/shares/" + encodeURIComponent(id) + "?key=" + API_KEY;

  fetch(url).then(function (r) {
    if (!r.ok) throw new Error("not found");
    return r.json();
  }).then(function (doc) {
    render(unwrap({ mapValue: { fields: doc.fields } }));
  }).catch(function () {
    content.innerHTML = '<div class="state">この投稿は見つかりませんでした。<br>アプリで探してみてください。</div>' +
      '<div class="gate"><a class="btn btn-store" href="' + STORE_URL + '">App Store でひらく</a></div>';
  });

  function unwrap(v) {
    if (v == null) return null;
    if ("stringValue" in v) return v.stringValue;
    if ("integerValue" in v) return parseInt(v.integerValue, 10);
    if ("doubleValue" in v) return v.doubleValue;
    if ("booleanValue" in v) return v.booleanValue;
    if ("arrayValue" in v) return (v.arrayValue.values || []).map(unwrap);
    if ("mapValue" in v) { var o={}, f=v.mapValue.fields||{}; for (var k in f) o[k]=unwrap(f[k]); return o; }
    return null;
  }
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c];
    });
  }

  function msgHTML(label, text, isOP, imageURL, hasMedia) {
    var media = "";
    if (imageURL) media = '<div class="media"><img src="' + esc(imageURL) + '" alt="" loading="lazy" /></div>';
    else if (hasMedia) media = '<div class="media">📷 写真・動画つき</div>';
    return '<div class="msg">' +
      '<div class="ava">' + PERSON + '</div>' +
      '<div class="body">' +
        '<div class="lbl"><span class="name">' + esc(label) + '</span>' +
          (isOP ? '<span class="op">質問者</span>' : '') + '</div>' +
        (text ? '<div class="txt">' + esc(text) + '</div>' : '') + media +
      '</div></div>';
  }

  function render(d) {
    if (d.type === "post") { renderPost(d); return; }
    var op = d.op || {}, comments = d.comments || [];
    var total = d.totalComments || 0;
    var remaining = Math.max(0, total - comments.length);

    // ヒーロー (カバー画像 or 紫グラデ) + ルーム名 + 参加人数/匿名可
    var hero = '<div class="hero"' +
      (d.roomImageURL ? ' style="background-image:linear-gradient(rgba(0,0,0,.05),rgba(0,0,0,.05)),url(\'' + esc(d.roomImageURL) + '\')"' : '') +
      '><div class="meta">' +
        '<div class="rname">' + esc(d.roomName || "相談") + '</div>' +
        '<div class="rsub">' + (d.memberCount ? (d.memberCount + "人が参加中") : "交流ルーム") +
          (d.allowAnonymous === false ? "" : " ・ 匿名で書けます") + '</div>' +
      '</div></div>';

    var body = '<div class="list">';
    body += msgHTML(op.label || "匿名", op.text, true, op.imageURL, false);
    comments.forEach(function (c) {
      body += '<div class="divider"></div>' + msgHTML(c.label || "匿名", c.text, false, null, c.hasMedia);
    });
    body += '</div><div class="fade"></div>';

    var moreText = remaining > 0 ? ("このあと " + remaining + " 件の返信があります 🔒")
                                 : "続きや返信はアプリで読めます 🔒";
    var gate = '<div class="gate">' +
      '<div class="more">' + moreText + '</div>' +
      '<a class="btn btn-primary" id="openApp" href="#">アプリで続きを見る</a>' +
      '<a class="btn btn-store" href="' + STORE_URL + '">App Store でダウンロード</a>' +
      '<div class="hint" id="hint">匿名で相談・交流できるアプリです。</div></div>';

    content.innerHTML = hero + body + gate;
    wireOpen(d.deepLink || "shotlingua://");
  }

  // みんなの投稿の 1 枚。
  function renderPost(d) {
    var img = d.imageURL ? '<img class="pimg" src="' + esc(d.imageURL) + '" alt="" loading="lazy" />' : "";
    var card = '<div class="postwrap"><div class="post">' +
      '<div class="phead"><div class="ava">' + PERSON + '</div><div class="pname">' + esc(d.authorLabel || "ユーザー") + '</div></div>' +
      (d.text ? '<div class="ptext">' + esc(d.text) + '</div>' : "") +
      img +
    '</div></div>';
    var gate = '<div class="gate">' +
      '<div class="more">リアクション・コメント・続きはアプリで 🔒</div>' +
      '<a class="btn btn-primary" id="openApp" href="#">アプリで開く</a>' +
      '<a class="btn btn-store" href="' + STORE_URL + '">App Store でダウンロード</a>' +
      '<div class="hint" id="hint">母語で打って学習言語で読む、翻訳SNS。</div></div>';
    content.innerHTML = card + gate;
    wireOpen(d.deepLink || "shotlingua://");
  }

  function wireOpen(appURL) {
    var ua = navigator.userAgent || "";
    var inApp = /Instagram|FBAN|FBAV|Line\//i.test(ua);
    var open = document.getElementById("openApp");
    if (!open) return;
    if (inApp) document.getElementById("hint").textContent =
      "うまく開けない時は、右上の「…」から「外部ブラウザで開く」を選んでください。";
    open.addEventListener("click", function (e) {
      e.preventDefault();
      var start = Date.now();
      var t = setTimeout(function () { if (Date.now() - start < 1600) location.href = STORE_URL; }, 1200);
      window.location.href = appURL;
      window.addEventListener("pagehide", function () { clearTimeout(t); });
    });
  }
})();
</script>
</body>
</html>
