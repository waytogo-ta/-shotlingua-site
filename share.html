<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>ShotLingua の話題</title>

<meta property="og:title" content="ShotLingua で話題の相談 👀" />
<meta property="og:description" content="匿名で相談・交流できるアプリ ShotLingua。続きはアプリで読めます。" />
<meta property="og:type" content="website" />
<meta property="og:site_name" content="ShotLingua" />
<meta property="og:image" content="https://shotlingua.app/og-share-poyo.png" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:image" content="https://shotlingua.app/og-share-poyo.png" />
<meta name="apple-itunes-app" content="app-id=6760792510" />

<style>
  /* 【2026-10-21】アプリの夜空の見た目に合わせる(白い昔の UI をやめる)。主ボタンはミント+紺の字。 */
  :root{
    --purple:#7FE3CC; --purple-d:#5FCFB6; --purple-soft:rgba(127,227,204,.16);
    --ink:#EDEAF6; --head:#FFFFFF; --sub:rgba(255,255,255,.62); --faint:rgba(255,255,255,.42);
    --line:rgba(255,255,255,.10); --chip:rgba(255,255,255,.18); --bg:#0B0E2A;
    --scrim:linear-gradient(to top, rgba(10,8,20,.62), rgba(10,8,20,0) 62%);
    --cta-shadow:0 8px 24px rgba(127,227,204,.30);
    --pill-shadow:0 4px 14px rgba(0,0,0,.35);
    --card:#1A1C4A; --fade:#0B0E2A; --mintink:#100F35; --lav:#B8A9FF;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; }
  body{ font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;
    background:linear-gradient(180deg,#0B0E2A 0%,#151A45 60%,#1A1C4A 100%) fixed; color:var(--ink); min-height:100vh; }
  body::before{ content:""; position:fixed; inset:0; pointer-events:none; opacity:.55;
    background-image:radial-gradient(1px 1px at 12% 18%,#fff,transparent),radial-gradient(1px 1px at 72% 9%,#fff,transparent),
      radial-gradient(1.5px 1.5px at 40% 32%,#cfc6ff,transparent),radial-gradient(1px 1px at 88% 44%,#fff,transparent),
      radial-gradient(1px 1px at 22% 66%,#fff,transparent),radial-gradient(1.5px 1.5px at 64% 78%,#cfc6ff,transparent),
      radial-gradient(1px 1px at 8% 90%,#fff,transparent),radial-gradient(1px 1px at 92% 86%,#fff,transparent); }
  .wrap{ position:relative; }
  .wrap{ width:100%; max-width:430px; margin:0 auto; padding-bottom:150px; }

  /* header 44px */
  .hd{ height:44px; display:flex; align-items:center; gap:8px; padding:0 16px; }
  .hd img{ width:28px; height:28px; border-radius:24%; }
  .hd b{ font-size:15px; color:var(--head); }
  .hd .dom{ margin-left:auto; font-size:12px; color:var(--sub); }

  /* cover (room) */
  .cover{ position:relative; height:168px; width:100%; overflow:hidden;
    background:linear-gradient(135deg,#CFC6F0,#A9B8E8 60%,#9ED8D3); background-size:cover; background-position:center; }
  .cover::after{ content:""; position:absolute; inset:0; background:var(--scrim); }
  .cover .meta{ position:absolute; left:16px; bottom:14px; z-index:2; display:flex; flex-direction:column; gap:7px; }
  .chiprow{ display:flex; gap:6px; align-items:center; }
  .rchip{ background:rgba(255,255,255,.94); color:#14121C; font-size:11px; font-weight:800; padding:4px 9px; border-radius:999px; }
  .hot{ background:var(--purple); color:var(--mintink); font-size:11px; font-weight:800; padding:4px 9px; border-radius:999px; }
  .ctitle{ font-size:20px; font-weight:800; color:#fff; text-shadow:0 1px 6px rgba(0,0,0,.35); }

  /* 賑わい行 */
  .buzz{ display:flex; align-items:center; gap:10px; }
  .avstack{ display:flex; }
  .avstack .d{ width:26px; height:26px; border-radius:50%; margin-left:-9px; border:2px solid var(--bg); }
  .avstack .d:first-child{ margin-left:0; }
  .plus{ width:26px; height:26px; border-radius:50%; margin-left:-9px; border:2px solid var(--bg);
    background:#2A2F6A; color:var(--purple); font-size:9px; font-weight:800; display:flex; align-items:center; justify-content:center; }
  .buzz .t{ font-size:13px; font-weight:700; color:var(--ink); }

  /* messages */
  .msgs{ padding:2px 16px 0; }
  .msg{ display:flex; gap:11px; padding:9px 0; }
  .av{ flex:0 0 32px; width:32px; height:32px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    color:#fff; font-size:13px; font-weight:800; }
  .msg .bd{ flex:1; min-width:0; }
  .nm{ display:flex; align-items:center; gap:6px; margin-bottom:3px; flex-wrap:wrap; }
  .nm .n{ font-size:13px; font-weight:700; color:var(--head); }
  .nm .op{ font-size:10px; font-weight:800; color:var(--purple); background:var(--purple-soft); padding:1px 6px; border-radius:5px; }
  .nm .tm{ font-size:11px; color:var(--sub); }
  .tx{ font-size:15px; line-height:1.55; color:var(--ink); white-space:pre-wrap; word-break:break-word; text-wrap:pretty; }
  .media{ margin-top:6px; font-size:12px; color:var(--sub); }

  /* post */
  .pauthor{ display:flex; align-items:center; gap:11px; padding:0 16px; }
  .pauthor .av40{ width:60px; height:60px; border-radius:50%; background:#2A2F6A; display:flex; align-items:center; justify-content:center;
    overflow:hidden; flex:0 0 60px; box-shadow:0 0 0 2.5px var(--purple), 0 6px 18px rgba(127,227,204,.25); }
  .pauthor .av40 img{ width:100%; height:100%; object-fit:cover; display:block; }
  .pauthor .av40 svg{ width:30px; height:30px; fill:#8F86C9; }
  .pname{ font-size:18px; font-weight:800; color:var(--head); }
  .puser{ font-size:13px; color:var(--sub); margin-top:1px; }
  .pmeta{ font-size:12px; color:var(--sub); display:flex; align-items:center; gap:6px; margin-top:1px; }
  .langbadge{ background:var(--purple-soft); color:var(--purple); font-size:11px; font-weight:800; padding:1px 7px; border-radius:5px; }
  .ptext{ font-size:16px; line-height:1.6; color:var(--ink); padding:12px 16px 0; white-space:pre-wrap; word-break:break-word; }
  .pimg{ width:calc(100% - 32px); aspect-ratio:4/5; max-height:520px; object-fit:cover; border-radius:18px; margin:12px 16px 0; display:block;
    box-shadow:0 10px 30px rgba(0,0,0,.35); }
  .pimgs{ display:flex; gap:10px; overflow-x:auto; scroll-snap-type:x mandatory; padding:12px 16px 0; -webkit-overflow-scrolling:touch; }
  .pimgs img{ flex:0 0 82%; aspect-ratio:4/5; object-fit:cover; border-radius:18px; scroll-snap-align:start; box-shadow:0 10px 30px rgba(0,0,0,.35); }
  .pimgs::-webkit-scrollbar{ display:none; }
  .rx{ display:flex; gap:8px; padding:12px 16px 0; flex-wrap:wrap; }
  .rx .p{ border:1px solid var(--chip); background:rgba(255,255,255,.06); border-radius:999px; padding:5px 11px; font-size:13px; font-weight:700; color:var(--ink); }
  .chead{ font-size:13px; font-weight:800; color:var(--sub); padding:14px 16px 2px; }

  /* cutoff (no lock) */
  .cut{ position:relative; margin-top:6px; overflow:hidden; }
  .cut .sk{ padding:10px 16px 0; filter:blur(4.5px); opacity:.5; }
  .cut .skrow{ display:flex; gap:11px; padding:9px 0; align-items:flex-start; }
  .cut .skav{ width:32px; height:32px; border-radius:50%; background:#3A3550; flex:0 0 32px; }
  .cut .skbars{ flex:1; }
  .cut .bar{ height:9px; border-radius:6px; margin-bottom:6px; background:#3A3550; }
  .cut .bar.nm{ width:34%; background:#2A2636; height:8px; }
  .cut .fade{ position:absolute; inset:0; background:linear-gradient(to bottom, rgba(11,14,42,0), rgba(11,14,42,.86) 55%, var(--fade)); }
  .cut .pill{ position:absolute; left:50%; bottom:8px; transform:translateX(-50%); z-index:2;
    background:var(--card); box-shadow:var(--pill-shadow); border-radius:999px; padding:7px 15px; font-size:13px; font-weight:700; color:var(--head); white-space:nowrap; }

  .empty{ text-align:center; color:var(--sub); font-size:14px; padding:26px 24px 8px; line-height:1.6; }

  /* fixed CTA */
  .cta{ position:fixed; left:0; right:0; bottom:0; z-index:10; background:rgba(11,14,42,.92); -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px);
    padding:12px 16px calc(14px + env(safe-area-inset-bottom)); border-top:1px solid var(--line); }
  .cta .wrapin{ max-width:430px; margin:0 auto; }
  .cta a.main{ display:block; height:54px; line-height:54px; text-align:center; border-radius:16px;
    background:var(--purple); color:var(--mintink); font-size:17px; font-weight:800; text-decoration:none; box-shadow:var(--cta-shadow); border-radius:999px; }
  .cta a.main:active{ background:var(--purple-d); }
  .cta .store{ text-align:center; font-size:13px; color:var(--sub); margin-top:10px; }
  .cta .store a{ color:var(--purple); text-decoration:underline; font-weight:700; }
  .cta .tag{ text-align:center; font-size:11px; color:var(--faint); margin-top:5px; }
  .cta .lineNote{ text-align:center; font-size:11px; color:var(--faint); margin-top:6px; display:none; }

  .state{ text-align:center; color:var(--sub); font-size:14px; padding:60px 24px; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="hd"><img src="appicon-poyo.png" alt="" /><b><span style="color:#7FE3CC">Shot</span>Lingua</b><span class="dom">shotlingua.app</span></div>
    <div id="content"><div class="state">読み込み中…</div></div>
  </div>
  <div class="cta" id="cta" style="display:none">
    <div class="wrapin">
      <a class="main" id="openApp" href="#">アプリで続きを見る</a>
      <div class="store">アプリが無い方は <a href="https://apps.apple.com/app/id6760792510">App Storeへ</a></div>
      <div class="tag">言葉が違っても、世界中の人と友達になれる</div>
      <div class="lineNote" id="lineNote">うまく開けない時は、右上の「…」から「外部ブラウザで開く」を選んでください。</div>
    </div>
  </div>

<script>
(function(){
  var API_KEY="AIzaSyAodG25aOXTOfwsn0X1RsgHliJ7u0TOhBo", PROJECT="shotlingua-12";
  var STORE="https://apps.apple.com/app/id6760792510";
  var PALETTE=["#F0A6B6","#8CC5E8","#C3B4F0","#F5D08A","#9BDCC6"];
  var FLAGS={ja:"🇯🇵",ko:"🇰🇷",en:"🇺🇸",zh:"🇨🇳"};
  var PERSON='<svg viewBox="0 0 24 24"><path d="M12 12a5 5 0 100-10 5 5 0 000 10zm0 2c-5 0-9 2.5-9 6v2h18v-2c0-3.5-4-6-9-6z"/></svg>';
  var content=document.getElementById("content");
  var id=(new URLSearchParams(location.search).get("id")||"").trim();
  if(!id){ content.innerHTML='<div class="state">リンクが正しくありません。</div>'; return; }

  fetch("https://firestore.googleapis.com/v1/projects/"+PROJECT+"/databases/(default)/documents/shares/"+encodeURIComponent(id)+"?key="+API_KEY)
    .then(function(r){ if(!r.ok) throw 0; return r.json(); })
    .then(function(doc){ render(unwrap({mapValue:{fields:doc.fields}})); })
    .catch(function(){
      content.innerHTML='<div class="state">この投稿は見つかりませんでした。<br>アプリで探してみてください。</div>';
      showCTA("shotlingua://");
    });

  function unwrap(v){
    if(v==null) return null;
    if("stringValue" in v) return v.stringValue;
    if("integerValue" in v) return parseInt(v.integerValue,10);
    if("doubleValue" in v) return v.doubleValue;
    if("booleanValue" in v) return v.booleanValue;
    if("arrayValue" in v) return (v.arrayValue.values||[]).map(unwrap);
    if("mapValue" in v){ var o={},f=v.mapValue.fields||{}; for(var k in f) o[k]=unwrap(f[k]); return o; }
    return null;
  }
  function countryFlag(c){ c=String(c||"").toUpperCase(); if(!/^[A-Z]{2}$/.test(c)) return "";
    return String.fromCodePoint(0x1F1E6+c.charCodeAt(0)-65, 0x1F1E6+c.charCodeAt(1)-65); }
  function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
  function hue(s){ var h=0; s=String(s||""); for(var i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))>>>0; return PALETTE[h%PALETTE.length]; }
  function ago(ms){ if(!ms) return ""; var s=(Date.now()-ms)/1000;
    if(s<60) return "たった今"; if(s<3600) return Math.floor(s/60)+"分前";
    if(s<86400) return Math.floor(s/3600)+"時間前"; if(s<604800) return Math.floor(s/86400)+"日前";
    return Math.floor(s/604800)+"週間前"; }

  // 賑わい行の重ねアバター(ハッシュ色のダミー円)。
  function avstack(n, size){
    n=Math.max(0,n); var show=Math.min(4,n), h='<div class="avstack">';
    for(var i=0;i<show;i++) h+='<div class="d" style="width:'+size+'px;height:'+size+'px;margin-left:'+(i?-9:0)+'px;background:'+PALETTE[i%PALETTE.length]+'"></div>';
    if(n>4) h+='<span class="plus" style="width:'+size+'px;height:'+size+'px">+'+(n-4)+'</span>';
    return h+'</div>';
  }
  function cutoff(remaining, unit, h){
    if(remaining<=0) return "";
    return '<div class="cut" style="height:'+h+'px">'+
      '<div class="sk">'+skRow()+skRow()+'</div>'+
      '<div class="fade"></div>'+
      '<div class="pill">この先に '+remaining+'件 の'+unit+'</div></div>';
  }
  function skRow(){ return '<div class="skrow"><div class="skav"></div><div class="skbars">'+
    '<div class="bar nm"></div><div class="bar" style="width:'+(70+Math.round(20*Math.random()))+'%"></div>'+
    '<div class="bar" style="width:'+(40+Math.round(30*Math.random()))+'%"></div></div></div>'; }

  function msgHTML(m){
    var media = m.hasMedia ? '<div class="media">📷 写真・動画つき</div>' : "";
    return '<div class="msg"><div class="av" style="background:'+hue(m.label)+'">'+esc((m.label||"？").replace(/[^0-9]/g,"")||"匿").slice(-2)+'</div>'+
      '<div class="bd"><div class="nm"><span class="n">'+esc(m.label||"匿名")+'</span>'+
      (m.op?'<span class="op">質問者</span>':'')+ (m.timeMs?'<span class="tm">'+ago(m.timeMs)+'</span>':'') +'</div>'+
      (m.text?'<div class="tx">'+esc(m.text)+'</div>':'')+media+'</div></div>';
  }

  function render(d){ if(d.type==="post"){ renderPost(d); } else { renderRoom(d); } }

  function renderRoom(d){
    var msgs=d.messages||[], people=d.peopleCount||0, total=d.totalComments||0;
    var replies=Math.max(0, msgs.length-1);       // OP を除いた表示コメント数
    var remaining=Math.max(0, total - replies);
    var hot = total>=5;

    var cover='<div class="cover"'+(d.roomImageURL?' style="background-image:'+"url('"+esc(d.roomImageURL)+"')"+'"':'')+'>'+
      '<div class="meta"><div class="chiprow"><span class="rchip"># '+esc(d.roomName||"相談")+'</span>'+
      (hot?'<span class="hot">🔥 話題</span>':'')+'</div></div></div>';

    var buzz = people>1 ? '<div class="buzz" style="padding:14px 16px 12px">'+avstack(people,26)+
      '<span class="t">'+people+'人が話している'+(people>3?' 🔥':'')+'</span></div>' : '<div style="height:8px"></div>';

    var body='<div class="msgs">'; msgs.forEach(function(m){ body+=msgHTML(m); }); body+='</div>';

    var tail;
    if(replies===0 && total===0){
      tail='<div class="empty">まだ会話がありません。<br>最初の一言をアプリで。</div>';
    } else {
      tail=cutoff(remaining,"返信",112);
    }
    content.innerHTML=cover+buzz+body+tail;
    showCTA(d.deepLink||"shotlingua://");
  }

  function renderPost(d){
    // みんなの投稿は公開コンテンツ → モザイク(ブラー途切れ)なしで丸ごと見せる。
    var rc=d.reactionCount||0, reactions=d.reactions||[], comments=d.comments||[];
    var cc=d.commentCount||0;
    // 旗は投稿した人の国(無ければ出さない)。言語から決めると英語の人が全員 🇺🇸 になっていた。
    var flag=countryFlag(d.authorCountry);

    var buzz = rc>0 ? '<div class="buzz" style="padding:16px 16px 0">'+avstack(rc,24)+
      '<span class="t">'+rc+'人がリアクションした'+(rc>3?' 🔥':'')+'</span></div>' : '';

    var face = d.authorIcon ? '<img src="'+esc(d.authorIcon)+'" alt="" onerror="this.remove()" />' : PERSON;
    var uname = (d.authorLabel||"").charAt(0)==="@" ? d.authorLabel : "";
    var title = d.authorName || d.authorLabel || "ユーザー";
    var author='<div class="pauthor" style="margin-top:'+(rc>0?14:18)+'px"><div class="av40">'+face+'</div>'+
      '<div><div class="pname">'+esc(title)+(flag?' <span style="font-size:16px">'+flag+'</span>':'')+'</div>'+
      (uname && uname!==("@"+title) && uname!==title ? '<div class="puser">'+esc(uname)+'</div>' : '')+
      '<div class="pmeta"><span>'+ago(d.createdAtMs)+'</span></div></div></div>';

    var text=d.text?'<div class="ptext">'+esc(d.text)+'</div>':'';
    var list=(d.imageURLs&&d.imageURLs.length>1)?d.imageURLs:(d.imageURL?[d.imageURL]:[]);
    var img = list.length>1
      ? '<div class="pimgs">'+list.map(function(u){return '<img src="'+esc(u)+'" alt="" loading="lazy" />';}).join('')+'</div>'
      : (list.length?'<img class="pimg" src="'+esc(list[0])+'" alt="" loading="lazy" />':'');
    var rx=reactions.length?'<div class="rx">'+reactions.map(function(r){return '<span class="p">'+esc(r.emoji)+' '+(r.count||0)+'</span>';}).join('')+'</div>':'';

    var cbody='';
    if(cc>0){
      cbody+='<div class="chead">コメント '+cc+'件</div><div class="msgs">';
      comments.forEach(function(c){ cbody+='<div class="msg"><div class="av" style="background:'+hue(c.label)+';font-size:12px">'+PERSON.replace('20 20','24 24')+'</div><div class="bd"><div class="nm"><span class="n">'+esc(c.label||"ユーザー")+'</span></div><div class="tx">'+esc(c.text)+'</div></div></div>'; });
      cbody+='</div>';
    }
    // モザイクなし: 途切れゾーンは付けない。丸ごと表示 + 下部CTA。
    content.innerHTML=buzz+author+text+img+rx+cbody;
    showCTA(d.deepLink||"shotlingua://");
  }

  function showCTA(appURL){
    var cta=document.getElementById("cta"); cta.style.display="block";
    var ua=navigator.userAgent||"", inApp=/Instagram|FBAN|FBAV|Line\//i.test(ua);
    if(inApp) document.getElementById("lineNote").style.display="block";
    var open=document.getElementById("openApp");
    open.addEventListener("click",function(e){ e.preventDefault();
      var start=Date.now();
      var t=setTimeout(function(){ if(Date.now()-start<1600) location.href=STORE; },1200);
      window.location.href=appURL;
      window.addEventListener("pagehide",function(){ clearTimeout(t); });
    });
  }
})();
</script>
</body>
</html>
